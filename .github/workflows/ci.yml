name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Engine tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run converter regression tests
        run: swift test

  ios-build:
    name: Unsigned iOS build
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build app and keyboard extension
        run: >-
          xcodebuild
          -project FinglishKeyboard.xcodeproj
          -scheme FinglishKeyboard
          -configuration Debug
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build
